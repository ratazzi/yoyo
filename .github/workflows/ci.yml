name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install toolchain
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Run project checks
        run: mise run test

      - name: Fetch Sparkle
        env:
          GH_TOKEN: ${{ github.token }}
        run: zsh scripts/release/fetch-sparkle.sh

      - name: Test update feeds and signatures
        run: mise run test:updates

      - name: Typecheck application with Sparkle
        run: mise exec -- /usr/bin/swiftc -typecheck -module-cache-path build/tests/ModuleCache -F build/dependencies/sparkle -import-objc-header Sources/App/AppBridge.h Sources/App/*.swift
